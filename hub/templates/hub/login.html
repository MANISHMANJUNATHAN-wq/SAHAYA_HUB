<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer Login | Sahaya Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary-teal: #0f766e;
    }
    body {
      background-color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      max-width: 420px;
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>

  <div class="card auth-card bg-white p-4 border-0">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-dark">
        <i class="fa-solid fa-hands-holding-child text-info me-2"></i>Sahaya Hub
      </h3>
      <p class="text-muted small">Volunteer Portal Access</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2 small">
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter volunteer username" required autofocus>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn w-100 text-white fw-bold py-2" style="background-color: var(--primary-teal);">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top">
      <small class="text-muted">New community volunteer? <a href="{% url 'signup' %}" class="fw-semibold text-decoration-none">Register here</a></small>
      <br>
      <a href="{% url 'home' %}" class="small text-secondary text-decoration-none mt-2 d-inline-block">← Back to Public Feed</a>
    </div>
  </div>

</body>
</html>
